<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>数学特效 - 从中心向四周扩散飞出数学符号</title>
    <style>
        body { margin: 0; overflow: hidden; background: black; }
        #container { position: relative; width: 100vw; height: 100vh; }
        #canvas { position: absolute; top: 0; left: 0; }
        #controls {
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px; color: white; font-family: sans-serif; z-index: 10;
        }
        #controls label { display: block; margin: 5px 0; }
        button { margin-top: 10px; padding: 5px 10px; }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
        <div id="controls">
            <label>上传底图: <input type="file" id="upload" accept="image/*"></label>
            <label>飞行速度: <input type="range" id="speed" min="1" max="10" value="3"></label>
            <label>生成间隔 (ms): <input type="range" id="interval" min="100" max="2000" value="500"></label>
            <label>初始字体大小: <input type="range" id="initSize" min="10" max="30" value="15"></label>
            <label>字体增大倍率: <input type="range" id="scaleRate" min="1" max="5" step="0.1" value="2"></label>
            <label>消失距离 (相对画布): <input type="range" id="fadeDist" min="0.5" max="1.5" step="0.1" value="1"></label>
            <label>中心X (%): <input type="range" id="centerX" min="0" max="100" value="50"></label>
            <label>中心Y (%): <input type="range" id="centerY" min="0" max="100" value="50"></label>
            <button id="exportPNG">导出当前为PNG</button>
            <button id="exportGIF">导出2秒GIF (约24帧)</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.min.js"></script>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let img = new Image();
        img.src = ''; // 默认无底图，全黑背景

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 数学相关内容列表
        const contents = [
            'π', '∞', '∑', '∫', '√', '∏', '∆', '∇', '∂', 'θ', 'φ', 'α', 'β', 'γ', 'λ', 'σ',
            'sin', 'cos', 'tan', 'log', 'e^x', 'x²', 'f(x)', 'lim', 'dx', 'dy',
            '1+1=3?', '2+2=5?', '2*2=6?', '1+2=4?', '3*3=10?', '4/2=3?', '5-1=10?'
        ];

        class Particle {
            constructor(cx, cy) {
                this.text = contents[Math.floor(Math.random() * contents.length)];
                this.angle = Math.random() * Math.PI * 2;
                this.dist = 0;
                this.cx = cx;
                this.cy = cy;
                this.size = parseFloat(document.getElementById('initSize').value);
            }
            update() {
                const speed = parseFloat(document.getElementById('speed').value);
                this.dist += speed;
            }
            draw() {
                const scaleRate = parseFloat(document.getElementById('scaleRate').value);
                const currentSize = this.size + this.dist * scaleRate;
                const fadeDist = parseFloat(document.getElementById('fadeDist').value) * Math.max(canvas.width, canvas.height) / 2;
                const opacity = Math.max(0, 1 - this.dist / fadeDist);

                if (opacity <= 0) return false; // 已消失

                ctx.save();
                ctx.translate(this.cx + Math.cos(this.angle) * this.dist, this.cy + Math.sin(this.angle) * this.dist);
                ctx.font = `bold ${currentSize}px Arial`;
                ctx.fillStyle = 'white';
                ctx.strokeStyle = 'black';
                ctx.lineWidth = currentSize / 8;
                ctx.globalAlpha = opacity;
                ctx.strokeText(this.text, -currentSize / 4, currentSize / 4);
                ctx.fillText(this.text, -currentSize / 4, currentSize / 4);
                ctx.restore();
                return true;
            }
        }

        let particles = [];
        let intervalId = null;

        function startGenerating() {
            if (intervalId) clearInterval(intervalId);
            const interval = parseInt(document.getElementById('interval').value);
            intervalId = setInterval(() => {
                const cxPercent = parseFloat(document.getElementById('centerX').value) / 100;
                const cyPercent = parseFloat(document.getElementById('centerY').value) / 100;
                const cx = canvas.width * cxPercent;
                const cy = canvas.height * cyPercent;
                particles.push(new Particle(cx, cy));
            }, interval);
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (img.src) ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            particles = particles.filter(p => {
                p.update();
                return p.draw();
            });

            requestAnimationFrame(animate);
        }

        // 控件变化时重新启动生成
        ['speed', 'interval', 'initSize', 'scaleRate', 'fadeDist', 'centerX', 'centerY'].forEach(id => {
            document.getElementById(id).addEventListener('input', startGenerating);
        });

        // 上传图片
        document.getElementById('upload').addEventListener('change', e => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = ev => {
                    img.src = ev.target.result;
                    img.onload = () => { /* 图片加载后会自动绘制 */ };
                };
                reader.readAsDataURL(file);
            }
        });

        // 导出PNG
        document.getElementById('exportPNG').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'math_effect.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // 导出GIF (2秒，约24帧)
        document.getElementById('exportGIF').addEventListener('click', () => {
            const gif = new GIF({
                workers: 4,
                quality: 10,
                width: canvas.width,
                height: canvas.height,
                workerScript: 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js'
            });

            const frameCount = 24; // 约2秒 @12fps，但实际用requestAnimationFrame间隔
            const delay = 1000 / 12; // ~83ms per frame

            let frame = 0;
            function captureFrame() {
                if (frame >= frameCount) {
                    gif.render();
                    return;
                }

                // 手动更新一帧粒子
                particles.forEach(p => p.update());
                particles = particles.filter(p => p.draw());

                // 添加新粒子（模拟生成）
                const cxPercent = parseFloat(document.getElementById('centerX').value) / 100;
                const cyPercent = parseFloat(document.getElementById('centerY').value) / 100;
                const cx = canvas.width * cxPercent;
                const cy = canvas.height * cyPercent;
                if (Math.random() < 0.5) particles.push(new Particle(cx, cy)); // 粗略模拟

                gif.addFrame(ctx, {copy: true, delay: delay});
                frame++;
                requestAnimationFrame(captureFrame);
            }

            gif.on('finished', blob => {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = 'math_effect.gif';
                link.href = url;
                link.click();
            });

            captureFrame();
        });

        startGenerating();
        animate();
    </script>
</body>
</html>
