<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>数学字幕放射特效</title>
<style>
  body {
    background: #111;
    color: #eee;
    font-family: system-ui;
    display: flex;
    gap: 16px;
  }
  canvas {
    border: 1px solid #444;
  }
  .panel {
    width: 320px;
    font-size: 14px;
  }
  .panel label {
    display: block;
    margin-top: 8px;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="panel">
  <h3>参数设置</h3>

  <label>上传图片
    <input type="file" id="imgInput" accept="image/*">
  </label>

  <label>生成间隔(ms)
    <input type="range" id="spawnRate" min="50" max="500" value="150">
  </label>

  <label>飞行速度
    <input type="range" id="speed" min="0.5" max="5" step="0.1" value="2">
  </label>

  <label>消失半径
    <input type="range" id="radius" min="200" max="1200" value="600">
  </label>

  <label>初始字体(px)
    <input type="range" id="fontStart" min="8" max="32" value="12">
  </label>

  <label>字体增长速度
    <input type="range" id="fontGrow" min="0.02" max="0.3" step="0.01" value="0.08">
  </label>

  <label>中心点 X (%)
    <input type="range" id="centerX" min="0" max="100" value="50">
  </label>

  <label>中心点 Y (%)
    <input type="range" id="centerY" min="0" max="100" value="50">
  </label>

  <hr>

  <button id="shot">导出截图 (PNG)</button>
  <button id="record">录制2秒动图(WebM)</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let bgImg = null;
let particles = [];
let lastSpawn = 0;

const mathTexts = [
  "1+1=3", "2*2=6", "√(-1)=i",
  "sin(x)", "cos(x)", "lim x→∞",
  "∫x dx", "e^{iπ}+1=0",
  "log(0)", "∂f/∂x",
  "Σ(n=1→∞)", "x≠y",
  "0/0", "∞−∞", "NaN"
];

function randMath() {
  return mathTexts[Math.floor(Math.random() * mathTexts.length)];
}

class Particle {
  constructor(cx, cy) {
    const angle = Math.random() * Math.PI * 2;
    this.x = cx;
    this.y = cy;
    this.vx = Math.cos(angle);
    this.vy = Math.sin(angle);
    this.text = randMath();
    this.dist = 0;
    this.alpha = 1;
  }
  update(dt) {
    const speed = +speedInput.value;
    this.x += this.vx * speed * dt;
    this.y += this.vy * speed * dt;
    this.dist += speed * dt;

    const maxR = +radiusInput.value;
    this.alpha = Math.max(0, 1 - this.dist / maxR);
  }
  draw() {
    const fontSize =
      +fontStart.value + this.dist * +fontGrow.value;

    ctx.font = `${fontSize}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.globalAlpha = this.alpha;
    ctx.strokeStyle = "black";
    ctx.lineWidth = 3;
    ctx.strokeText(this.text, this.x, this.y);

    ctx.fillStyle = "white";
    ctx.fillText(this.text, this.x, this.y);

    ctx.globalAlpha = 1;
  }
}

function resizeCanvas() {
  if (!bgImg) return;
  canvas.width = bgImg.width;
  canvas.height = bgImg.height;
}
window.addEventListener('resize', resizeCanvas);

const spawnRateInput = document.getElementById('spawnRate');
const speedInput = document.getElementById('speed');
const radiusInput = document.getElementById('radius');
const fontStart = document.getElementById('fontStart');
const fontGrow = document.getElementById('fontGrow');
const centerXInput = document.getElementById('centerX');
const centerYInput = document.getElementById('centerY');

function loop(ts) {
  if (!bgImg) return requestAnimationFrame(loop);

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(bgImg, 0, 0);

  const cx = canvas.width * centerXInput.value / 100;
  const cy = canvas.height * centerYInput.value / 100;

  if (ts - lastSpawn > spawnRateInput.value) {
    particles.push(new Particle(cx, cy));
    lastSpawn = ts;
  }

  particles = particles.filter(p => p.alpha > 0);

  particles.forEach(p => {
    p.update(1);
    p.draw();
  });

  requestAnimationFrame(loop);
}

document.getElementById('imgInput').addEventListener('change', e => {
  const img = new Image();
  img.onload = () => {
    bgImg = img;
    resizeCanvas();
    particles = [];
    requestAnimationFrame(loop);
  };
  img.src = URL.createObjectURL(e.target.files[0]);
});

document.getElementById('shot').onclick = () => {
  const a = document.createElement('a');
  a.download = 'math_effect.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
};

document.getElementById('record').onclick = async () => {
  const stream = canvas.captureStream(12);
  const recorder = new MediaRecorder(stream);
  const chunks = [];
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.start();

  setTimeout(() => {
    recorder.stop();
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'math_effect.webm';
      a.click();
    };
  }, 2000);
};
</script>

</body>
</html>
